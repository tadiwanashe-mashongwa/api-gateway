spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: catalogue-service
              uri: ${CATALOGUE_SERVICE_URL:http://localhost:8081}
              predicates: ["Path=/api/parts/**,/api/brands/**,/api/categories/**"]
            - id: inventory-service
              uri: ${INVENTORY_SERVICE_URL:http://localhost:8082}
              predicates: [Path=/api/inventory/**]
            - id: order-service
              uri: ${ORDER_SERVICE_URL:http://localhost:8083}
              predicates: [Path=/api/orders/**]
            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8084}
              predicates: ["Path=/api/payments/**,/api/payment-outbox/**"]
            - id: customer-service
              uri: ${CUSTOMER_SERVICE_URL:http://localhost:8085}
              predicates: [Path=/api/customers/**]
            - id: shipping-service
              uri: ${SHIPPING_SERVICE_URL:http://localhost:8086}
              predicates: [Path=/api/shipments/**]
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}
              predicates: [Path=/api/notifications/**]
  webflux:
    cors:
      mappings:
        '[/**]':
          allowed-origins: ${CORS_ALLOWED_ORIGIN:http://localhost:3000}
          allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
          allowed-headers: '*'
          exposed-headers: [Location]
          allow-credentials: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
server:
  port: 8088
